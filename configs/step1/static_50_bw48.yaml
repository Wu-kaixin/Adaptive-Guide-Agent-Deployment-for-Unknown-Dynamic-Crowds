# Frozen version of the existing 50-person example, in metres and seconds.
step: 1
scene:
  type: square
  width: 40.0
  height: 40.0
  openings: []
crowd:
  source: grid
  count: 50
  grid: {rows: 5, columns: 10, origin: [16.0, 18.0], spacing: 0.75}
  spawn_vertices: [[15, 17], [24, 17], [24, 22], [15, 22]]
  spacing: 0.75
  radius: {mean: 0.20, std: 0.0, min: 0.20, max: 0.20}
  demand: {mean: 1.0, std: 0.0, min: 1.0, max: 1.0}
guides:
  count: 8
  radius: 0.25
  max_speed: 1.0
  initial_inset: 2.0
controller:
  method: equal_arc
  # Include the conservative navigation simplification margin as well.
  offset: 1.45
  sample_spacing: 0.10
  budget_gap: 4.0
  max_gap_limit: 4.0
  position_tolerance: 0.05
  speed_tolerance: 0.05
  curve_tolerance: 0.06
  arc_tolerance: 0.05
  safety_numeric_tolerance: 1.0e-7
  demand_bandwidth: 4.8
  gain: 1.2
  hold_steps: 10
  clearance: 1.0
  waypoint_tolerance: 0.05
  phases: [0.0, 0.25, 0.5, 0.75]
  quadrature_samples: 2048
  planner_max_iterations: 300
  stall_window: 20
  max_replans: 3
simulation:
  seed: 42
  dt: 0.1
  max_steps: 900
