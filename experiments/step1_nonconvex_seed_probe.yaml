# Frozen before any probe result is read.
# 3 scenes x 3 methods x 5 unused development seeds = 45 tasks.
# Seeds 0-19 are already used. Seeds 5000-5029 stay reserved.
schema_version: 1
protocol: scene_closure_seed_probe
formal_validation: false
base_spec: experiments/step1_scene_closure.yaml
seeds: [20, 21, 22, 23, 24]
seed_role: unused_development
scenes: [elongated, tight_u, wide_u]
guide_counts:
  elongated: 11
  tight_u: 13
  wide_u: 19
methods: [equal_arc, projected_mass, pairwise_euclidean]
perturbation:
  people_stream: [20261017, seed, 1]
  people_distribution: gaussian
  people_sigma_m: 0.04
  guide_stream: [20261017, seed, 2]
  guide_distribution: uniform_arc_on_inset
  guide_amplitude_m: 0.35
  draws: 1
  resample_on_failure: false
rules:
  - Draw each random stream once. A draw that breaks the 0.40 m center separation or leaves the room is an input failure for all three methods. Do not draw again.
  - Estimate the 1.3 m disk-union curve from that draw. Do not copy a saved curve and do not fall back to the convex hull or the 0.55 m offset.
  - Keep the guide counts from the nine-case regression. If ceil(L / 1.94) exceeds that count, record the violation and do not add guides.
  - Plan new targets on the new curve. The three methods share one person draw and one guide draw.
  - Solver budget stays at the base spec: 40 iterations and 20 s per pairwise start.
