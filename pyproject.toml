[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "udc-guide-deployment"
version = "0.1.0"
description = "Reproducible guide deployment around unknown crowds"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11,<2", "shapely>=2,<3",
  "PyYAML>=6,<7", "matplotlib>=3.8,<4", "pillow>=10,<13",
  "jupedsim==1.4.2", "threadpoolctl>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
analysis = ["PedPy==1.5.1"]
notebooks = ["ipykernel>=7,<8", "ipywidgets>=8,<9", "plotly>=6,<8"]

[project.scripts]
udc-run = "udc.experiments.runner:main"
udc-validate = "udc.experiments.validation:main"
udc-analyze = "udc.analysis.pedestrian:main"
udc-summarize = "udc.analysis.summary:main"
udc-plot = "udc.visualization.plots:main"
udc-live = "udc.visualization.live:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
