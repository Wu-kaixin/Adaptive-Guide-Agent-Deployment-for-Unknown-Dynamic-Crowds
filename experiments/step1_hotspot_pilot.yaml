# Step 1 controlled hotspot pilot. One simple scene, one medium crowd,
# two demand fields, three fixed guide counts, five methods, seeds 0-4.
# 2 x 3 x 5 x 5 = 150 tasks. Development seeds only; 5000-5029 are reserved.
schema_version: 1
protocol: fixed_n
methods: [equal_arc, average_cvt, mass_cvt, distmesh, ra_abdc]
development_seeds: [0, 1, 2, 3, 4]
reserved_validation_seeds: [5000, 5029]
notes:
  - Inside one (demand, resource, seed) cell every method shares the frozen crowd snapshot, demand field, guide initial state, boundary and guide count.
  - Guide counts are offsets from the spawn-based necessary bound ceil(L_spawn / (max_gap_limit - 2 arc_tolerance)); for this cell that bound is 15. The realised hull is shorter, so the realised bound is 14 for seeds 0-4. The tiers are therefore 14 / 17 / 19 guides; they are geometric budgets, not labels of sufficiency.
  - The hotspot is a disk fixed in scene coordinates on the +x side of the crowd; background demand is constant (std 0), so the disk is the only spatial structure. Demand is a planning weight, not a validated risk.
shared:
  spacing: 0.55
  radius: {mean: 0.20, std: 0.015, min: 0.17, max: 0.23}
  guides: {radius: 0.20, max_speed: 1.0, initial_inset: 1.0}
  controller:
    offset: 1.3
    sample_spacing: 0.1
    budget_gap: 2.0
    max_gap_limit: 2.0
    position_tolerance: 0.03
    speed_tolerance: 0.03
    curve_tolerance: 0.04
    arc_tolerance: 0.03
    safety_numeric_tolerance: 1.0e-7
    demand_bandwidth: 1.2
    gain: 1.5
    hold_steps: 10
    clearance: 0.35
    waypoint_tolerance: 0.05
    phases: [0.0, 0.25, 0.5, 0.75]
    quadrature_samples: 2048
    planner_max_iterations: 300
    stall_window: 20
    max_replans: 3
  simulation: {dt: 0.1, max_steps: 400}
factors:
  environment:
    square: {type: square, width: 20.0, height: 20.0}
  shape: [circle]
  size:
    medium: {count: 50}
  demand:
    uniform: {mean: 1.0, std: 0.0, min: 1.0, max: 1.0}
    hotspot:
      mean: 1.0
      std: 0.0
      min: 1.0
      max: 3.0
      multiplier: 3.0
      radius_scale: 0.45
      offset_scale: 0.55
  resource:
    tight: {relative: -1}
    moderate: {relative: 2}
    ample: {relative: 4}
